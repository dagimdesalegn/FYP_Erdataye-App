server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.227.217.222 _;

    root /var/www/erdataya/site;
    index index.html;

    # Baseline browser hardening. Add strict CSP rules in app-specific configs if needed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; block-all-mixed-content" always;

    # Landing page and static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve the Expo staff/admin web export from the same IP using path routes.
    location = /staff {
        return 302 /staff/;
    }

    location = /admin {
        return 302 /admin/;
    }

    location ^~ /staff/ {
        alias /var/www/erdataya/staff/;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ^~ /admin/ {
        alias /var/www/erdataya/staff/;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ^~ /_expo/ {
        alias /var/www/erdataya/staff/_expo/;
        try_files $uri =404;
    }

    # Do not fallback image requests to index.html; let browser error so JS fallback can run.
    location ^~ /assets/images/ {
        try_files $uri =404;
    }

    # APK: binary-safe (no gzip). MIME comes from file extension (.apk) — do not add a second Content-Type.
    location = /erdataye.apk {
        alias /var/www/erdataya/erdataye.apk;
        gzip off;
        add_header Content-Disposition "attachment; filename=erdataye.apk" always;
        add_header Cache-Control "no-transform" always;
    }

    location = /downloads/erdataye.apk {
        alias /var/www/erdataya/downloads/erdataye.apk;
        gzip off;
        add_header Content-Disposition "attachment; filename=erdataye.apk" always;
        add_header Cache-Control "no-transform" always;
    }

    # Backend API proxy (keeps existing mobile clients working)
    location /api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
