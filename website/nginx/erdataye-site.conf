server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name erdatayee.tech www.erdatayee.tech 95.111.253.90 _;

    if ($host = www.erdatayee.tech) {
        return 301 https://www.erdatayee.tech$request_uri;
    }

    root /var/www/erdataya;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.erdatayee.tech;

    ssl_certificate /etc/letsencrypt/live/www.erdatayee.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.erdatayee.tech/privkey.pem;

    root /var/www/erdataya;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Landing page (site root only)
    location = / {
        try_files /index.html =404;
    }

    location = /staff { return 302 /staff/; }
    location = /admin { return 302 /admin/; }
    location = /hospital { return 302 /hospital/; }

    # Expo static export: serve the correct route HTML shell per dashboard path.
    location /staff/ {
        try_files $uri $uri/ /staff/staff.html;
    }

    location /admin/ {
        try_files $uri $uri/ /staff/admin.html;
    }

    location /hospital/ {
        try_files $uri $uri/ /staff/hospital.html;
    }

    location ^~ /_expo/ {
        alias /var/www/erdataya/staff/_expo/;
        try_files $uri =404;
    }

    # Expo web export references /assets/* from site root — landing first, then staff bundle.
    location ^~ /assets/ {
        try_files $uri /staff$uri =404;
    }

    location = /erdataye.apk {
        alias /var/www/erdataya/erdataye.apk;
        gzip off;
        add_header Content-Disposition "attachment; filename=erdataye.apk" always;
    }

    location = /downloads/erdataye.apk {
        alias /var/www/erdataya/downloads/erdataye.apk;
        gzip off;
        add_header Content-Disposition "attachment; filename=erdataye.apk" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other static landing assets (css, js, manifest, etc.)
    location / {
        try_files $uri $uri/ =404;
    }
}
